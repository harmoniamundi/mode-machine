        function initAudio(callback) {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                if ('audioSession' in navigator) {
                    navigator.audioSession.type = 'playback';
                }

                gainNode = audioCtx.createGain();
                gainNode.gain.value = parseFloat(document.getElementById('volume').value);
                gainNode.connect(audioCtx.destination);

                Soundfont.instrument(audioCtx, 'acoustic_grand_piano', { destination: gainNode }).then(function (inst) {
                    pianoInstrument = inst;
                    if (callback) callback();
                }).catch(err => {
                    console.error("Échec du chargement des échantillons de piano", err);
                });
            } else if (pianoInstrument && callback) {
                callback();
            }
        }

        function updateVolume(val) {
            if (gainNode && audioCtx) {
                gainNode.gain.setValueAtTime(parseFloat(val), audioCtx.currentTime);
            }
        }

        let audioUnlocked = false;

        // Sur iOS/Android, l'audio ne peut démarrer que depuis un geste de l'utilisateur
        // (touchend / click), et pas depuis un setTimeout : on le déverrouille ici.
        function unlockAudio() {
            if (!audioCtx) return;
            if (audioCtx.state !== 'running') {
                audioCtx.resume().catch(() => {});
            }
            if (!audioUnlocked) {
                try {
                    const buffer = audioCtx.createBuffer(1, 1, 22050);
                    const src = audioCtx.createBufferSource();
                    src.buffer = buffer;
                    src.connect(audioCtx.destination);
                    src.start(0);
                    audioUnlocked = true;
                } catch (err) {
                    console.error("Déverrouillage audio impossible", err);
                }
            }
        }

        ['touchend', 'click', 'keydown'].forEach(evt => {
            document.addEventListener(evt, unlockAudio, { passive: true });
        });

        function playMidi(midi, duration = 0.8) {
            if (!pianoInstrument || !audioCtx) return;
            const start = () => pianoInstrument.play(midi, audioCtx.currentTime, { duration: duration });
            if (audioCtx.state !== 'running') {
                audioCtx.resume().then(start).catch(start);
            } else {
                start();
            }
        }

        function stopAllAudio() {
            if (pianoInstrument) {
                pianoInstrument.stop();
            }
        }

        function stopCurrentPlayback() {
            stopAllAudio();
            document.querySelectorAll('.generator-box').forEach(b => {
                if (b.activeTimeouts) {
                    b.activeTimeouts.forEach(t => clearTimeout(t));
                    b.activeTimeouts = [];
                }
            });
            currentActiveElement = null;
        }

        function isNewDominoZone(target) {
            return !!target && !!target.closest && !target.closest('.generator-box') && !target.closest('.global-controls');
        }

        let lastNewDominoTime = 0;
        function requestNewGenerator(e) {
            if (!isNewDominoZone(e.target)) return;
            // Évite les doublons quand touchend ET dblclick se déclenchent pour le même double-tap
            const now = Date.now();
            if (now - lastNewDominoTime < 600) return;
            lastNewDominoTime = now;
            addGenerator();
        }

        // Double-clic à la souris (et sur les navigateurs qui le déclenchent au toucher)
        function handleBodyClick(e) {
            requestNewGenerator(e);
        }

        // Double-tap sur téléphone : détecté à la main car iOS ne déclenche pas toujours « dblclick »
        let touchStartX = 0, touchStartY = 0, touchMoved = false;
        let lastTapTime = 0, lastTapX = 0, lastTapY = 0;

        document.addEventListener('touchstart', (e) => {
            if (e.touches.length !== 1) { touchMoved = true; return; }
            touchMoved = false;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            if (t && Math.hypot(t.clientX - touchStartX, t.clientY - touchStartY) > 10) touchMoved = true;
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            if (touchMoved || !isNewDominoZone(e.target)) { lastTapTime = 0; return; }
            const t = e.changedTouches[0];
            const now = Date.now();
            if (now - lastTapTime < 350 && Math.hypot(t.clientX - lastTapX, t.clientY - lastTapY) < 40) {
                lastTapTime = 0;
                // Empêche Safari (iPhone) de zoomer sur le double-tap
                if (e.cancelable) e.preventDefault();
                requestNewGenerator(e);
            } else {
                lastTapTime = now;
                lastTapX = t.clientX;
                lastTapY = t.clientY;
            }
        }, { passive: false });

                                <option value="gamelan_madra">Gamelan Madra</option>
                            </optgroup>
                        </select>
                        <span class="transp-icon" title="Transposition" role="img" aria-label="Transposition"><svg viewBox="0 0 32 22" width="28" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 7.5v5M1.5 10H4"/><path d="M4 8.5h18M4 11.5h18M4 8.5v3"/><path d="M22 8.5 30 3.5v14L22 11.5"/><path d="M11 8.5V4M9.8 3.5h2.4M15 8.5V4M13.8 3.5h2.4M19 8.5V4M17.8 3.5h2.4"/><path d="M9 11.5v3.5a2.5 2.5 0 0 0 2.5 2.5h6a2.5 2.5 0 0 0 2.5-2.5v-3.5"/></svg></span>
                        <select class="transposition-select">
                            <option value="0">Ut</option>
                            <option value="-2">Sib</option>
                            <option value="-9">Mib</option>
                        </select>
                        <button class="view-toggle-btn" onclick="toggleView(this)" style="padding: 8px 12px; background: #333; color: #fff; border: 1px solid #555; cursor: pointer; border-radius: 4px;">↳ Intervalles</button>
                        <button class="direction-btn" onclick="toggleDirection(this.closest('.generator-box'))"></button>
                    </div>
                </div>
                <div class="output"></div>
            `;

            container.appendChild(box);

            const tonicSel = box.querySelector('.tonic-select');
            const scaleSel = box.querySelector('.scale-select');
            const transpSel = box.querySelector('.transposition-select');

            updateDirectionButton(box);

            tonicSel.value = tonicVal;
            scaleSel.value = scaleKey;
            transpSel.value = transpVal;

            const update = () => renderGenerator(box);
            tonicSel.onchange = update;
            scaleSel.onchange = update;
            transpSel.onchange = update;

            initAudio(update);
        }

        function generateAllModes() {
            stopCurrentPlayback();
            const container = document.getElementById('container');
            container.innerHTML = '';
            Object.keys(scaleIntervals).forEach(scaleKey => {
                addGenerator(scaleKey, 'c', '-2');
            });
        }

        function resetGenerators() {
            stopCurrentPlayback();
            const container = document.getElementById('container');
            container.innerHTML = '';
            addGenerator('major', 'c', '-2');
        }

        function getScaleIntervals(scaleKey, isDesc) {
            if (scaleKey === 'melodic_minor' && isDesc) return scaleIntervals['natural_minor'];
            return scaleIntervals[scaleKey] || scaleIntervals.major;
        }

        function accidentalFromDiff(diff) {
            return { '1': '#', '2': '##', '-1': 'b', '-2': 'bb' }[diff] || '';
        }

        // Écrit une note : la lettre vient du degré dans la gamme, l'altération de la hauteur réelle.
        // Si cela demandait plus d'un double dièse/bémol (impossible à noter), on prend la lettre voisine.
        function spellNote(tonicObj, degreeIndex, totalVal) {
            const midi = 60 + totalVal;
            const trySpelling = (letterIdx) => {
                const letter = letters[((letterIdx % 7) + 7) % 7];
                let bestOctave = 4, minDiff = Infinity;
                for (let o = 3; o <= 6; o++) {
                    const d = Math.abs(60 + naturalSemitones[letter] + (o - 4) * 12 - midi);
                    if (d < minDiff) { minDiff = d; bestOctave = o; }
                }
                const diff = midi - (60 + naturalSemitones[letter] + (bestOctave - 4) * 12);
                return { letter, octave: bestOctave, diff };
            };

            const baseLetterIdx = tonicObj.letterIdx + degreeIndex;
            let best = trySpelling(baseLetterIdx);
            if (Math.abs(best.diff) > 2) {
                for (const shift of [1, -1, 2, -2]) {
                    const alt = trySpelling(baseLetterIdx + shift);
                    if (Math.abs(alt.diff) < Math.abs(best.diff)) best = alt;
                }
            }
            return best;
        }

        // Liste des notes d'une gamme : touche VexFlow, altération, nom d'intervalle, hauteur sonore (MIDI)
        function buildScaleItems(scaleKey, tonicVal, transposition, isDesc) {
            const intervals = getScaleIntervals(scaleKey, isDesc);
            const tonicObj = tonicData[tonicVal] || tonicData['c'];
            const majorSemitones = [0, 2, 4, 5, 7, 9, 11];
            const mapping = scaleDegreeMappings[scaleKey];

            const items = intervals.map((interval, index) => {
                const totalVal = tonicObj.semitone + interval;
                const audioMidi = 60 + totalVal - 12 + transposition;
                const degreeIndex = (mapping && mapping[index] !== undefined) ? mapping[index] : index;

                const spelled = spellNote(tonicObj, degreeIndex, totalVal);
                const accidental = accidentalFromDiff(spelled.diff);
                const key = `${spelled.letter.toLowerCase()}${accidental}/${spelled.octave}`;

                let intervalName;
                if (interval === 12) {
                    intervalName = "1";
                } else {
                    const expectedSemi = majorSemitones[degreeIndex % 7];
                    intervalName = `${accidentalFromDiff((interval % 12) - expectedSemi)}${(degreeIndex % 7) + 1}`;
                }

                return { interval, midi: audioMidi, key, accidental, name: intervalName };
            });

            if (isDesc) items.reverse();
            return items;
        }

        function renderGenerator(box) {
            const tonicVal = box.querySelector('.tonic-select').value;
            const scaleKey = box.querySelector('.scale-select').value;
            const transposition = parseInt(box.querySelector('.transposition-select').value);
            const isDesc = box.dataset.direction === 'desc';

            const intervals = getScaleIntervals(scaleKey, isDesc);

            let contentWidth = Math.max(500, intervals.length * 50 + 50);

            const outputDiv = box.querySelector('.output');
            outputDiv.innerHTML = '';

            const items = buildScaleItems(scaleKey, tonicVal, transposition, isDesc);

            let scaleMidiNotes = items.map(item => item.midi);

            if (box.dataset.view === 'intervals') {
                items.forEach((item, index) => {
                    if (item.interval === 12 && !isDesc) return;
                    let span = document.createElement('span');
                    span.className = 'interval-item';
                    span.textContent = item.name;
                    span.dataset.midiIndex = index;
                    outputDiv.appendChild(span);
                });
            } else {
                const renderer = new Renderer(outputDiv, Renderer.Backends.SVG);
                renderer.resize(contentWidth - 20, 200);
                const context = renderer.getContext();

                const stave = new Stave(10, 40, contentWidth - 40);
                stave.addClef("treble");
                stave.setContext(context).draw();
                stave.setNoteStartX(stave.getNoteStartX() + 30);

                const notes = items.map((item) => {
                    let staveNote = new StaveNote({ clef: "treble", keys: [item.key], duration: "q" });
                    if (item.accidental === '##') {
                        staveNote.addModifier(new Accidental("##"), 0);
                    } else if (item.accidental === '#') {
                        staveNote.addModifier(new Accidental("#"), 0);
                    } else if (item.accidental === 'bb') {
                        staveNote.addModifier(new Accidental("bb"), 0);
                    } else if (item.accidental === 'b') {
                        staveNote.addModifier(new Accidental("b"), 0);
                    }
                    return staveNote;
                });

                const voice = new Voice({ num_beats: notes.length, beat_value: 4 });
                voice.addTickables(notes);

                const formatter = new Formatter().joinVoices([voice]);
                formatter.format([voice], contentWidth - 110);
                voice.draw(context, stave);

                const svgEl = outputDiv.querySelector('svg');
                if (svgEl) svgEl.setAttribute('viewBox', `0 0 ${contentWidth - 20} 200`);
            }

            if (!box.activeTimeouts) box.activeTimeouts = [];

            outputDiv.onclick = (e) => {
                e.stopPropagation();
                unlockAudio();
                let noteEl = e.target.closest('.vf-stavenote') || e.target.closest('.interval-item');
                let targetEl = noteEl || outputDiv;

                if (currentActiveElement === targetEl) {
                    stopCurrentPlayback();
                    return;
                }

                stopCurrentPlayback();
                currentActiveElement = targetEl;

                if (noteEl) {
                    let index;
                    if (box.dataset.view === 'intervals') {
                        index = parseInt(noteEl.dataset.midiIndex);
                    } else {
                        const allItems = Array.from(outputDiv.querySelectorAll('.vf-stavenote'));
                        index = allItems.indexOf(noteEl);
                    }

                    if (!isNaN(index) && scaleMidiNotes[index] !== undefined) {
                        playMidi(scaleMidiNotes[index], 0.8);
                        let t = setTimeout(() => {
                            if (currentActiveElement === targetEl) currentActiveElement = null;
                        }, 800);
                        box.activeTimeouts.push(t);
                    }
                } else {
                    scaleMidiNotes.forEach((midi, index) => {
                        let t = setTimeout(() => {
                            playMidi(midi, 0.8);
                        }, index * 400);
                        box.activeTimeouts.push(t);
                    });
                    let totalDuration = scaleMidiNotes.length * 400 + 400;
                    let tEnd = setTimeout(() => {
                        if (currentActiveElement === targetEl) currentActiveElement = null;
                    }, totalDuration);
                    box.activeTimeouts.push(tEnd);
                }
            };
        }

        window.onload = () => {
            initAudio(() => {
                addGenerator('major', 'c', '-2');
            });
        };
    </script>
